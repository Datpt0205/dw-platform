[project]
name = "digital-worker-platform"
version = "0.1.0"
description = "Digital Worker platform: multi-tenant agent runtime, knowledge, memory and approvals. Business bounded contexts plug in as packages."
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/docgen", "apps/worker", "packages/python/*"]

[tool.uv.sources]
dw-kernel = { workspace = true }
dw-platform = { workspace = true }
dw-agent-runtime = { workspace = true }
dw-knowledge = { workspace = true }
dw-memory = { workspace = true }
dw-connectors = { workspace = true }
dw-observability = { workspace = true }
dw-evals = { workspace = true }
dw-studio = { workspace = true }
dw-usage = { workspace = true }
dw-api = { workspace = true }
dw-docgen = { workspace = true }
dw-worker = { workspace = true }
# Docling (the worker's optional `parsers` extra) pulls torch, whose default
# wheels bundle a multi-GB CUDA runtime. Document parsing runs fine on CPU, so
# pin the CPU-only build: far smaller and faster to install, and the only
# sensible default for a host with no GPU.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "import-linter>=2.1,<3",
    "pre-commit>=4.0,<5",
    "asgi-lifespan>=2.1,<3",
    "types-pyyaml>=6.0,<7",
    "pytest-cov>=6.0,<8",
    # Windows ships no IANA tz database, so `zoneinfo.ZoneInfo("UTC")` — which
    # `alembic revision` needs for `alembic.ini`'s `timezone = UTC` — raises
    # ZoneInfoNotFoundError with no other symptom. Linux containers already
    # carry system tzdata; this is a dev-machine gap only, found by actually
    # running `alembic revision`, not by reading alembic's docs.
    "tzdata>=2024.1",
    "pytest-xdist>=3.6,<4",
    # The reference RFC 8785 serializer `dw_kernel.canonical` is tested against
    # (tenant-config R1.1); never a runtime dependency: the kernel is stdlib only.
    "rfc8785==0.1.4",
    # The Standard Webhooks 1.0 reference the signature module is tested
    # against (connections-and-vault R4.1); never a runtime dependency.
    "standardwebhooks==1.1.0",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format for the whole Python workspace
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/python/*/src",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "scripts",
]
# `vendor/` is third-party code pinned at a tag. Formatting it would make every
# re-vendor a conflict and every diff unreadable.
extend-exclude = ["db/migrations/versions", "vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "TID", # tidy imports
]
ignore = [
    "SIM117", # nested with is sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are immutable sentinels used in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
known-first-party = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_studio",
    "dw_usage",
    "dw_evals",
    "dw_api",
    "dw_docgen",
    "dw_worker",
]

# ---------------------------------------------------------------------------
# mypy — strict for src, relaxed-def for tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Pinned, not inferred. mypy narrows `sys.platform` to whatever machine it runs
# on, so a platform-guarded branch is live for one developer and unreachable for
# another — and with `warn_unreachable` that is not a difference of opinion, it
# is a typecheck that passes locally and fails in CI. Measured: every push was
# red on `runner.py` while mypy was green on Windows. Everything deployed runs
# in a Linux container, so that is the answer both should give.
platform = "linux"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = [
    "packages/python",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "scripts",
]
exclude = ['db/migrations/versions', 'tests/(unit|integration)/conftest\.py$']
mypy_path = [
    "packages/python/dw_kernel/src",
    "packages/python/dw_platform/src",
    "packages/python/dw_agent_runtime/src",
    "packages/python/dw_knowledge/src",
    "packages/python/dw_memory/src",
    "packages/python/dw_connectors/src",
    "packages/python/dw_observability/src",
    "packages/python/dw_evals/src",
    "packages/python/dw_studio/src",
    "packages/python/dw_usage/src",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
    "tests/support",
    "tests/e2e",
    "packages/python/dw_platform/tests/integration",
    "packages/python/dw_agent_runtime/tests/integration",
    "packages/python/dw_agent_runtime/tests/unit",
    "packages/python/dw_usage/tests/integration",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# asyncpg ships no py.typed marker. Used directly in exactly one place — the
# LISTEN connection, which cannot come from the SQLAlchemy pool.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# Ships `.pyi` stubs without a `py.typed` marker (ADR 0114 pins it exactly);
# only `dw_studio.core.adapters.cel` imports it.
[[tool.mypy.overrides]]
module = ["cel_expr_python", "cel_expr_python.*"]
follow_untyped_imports = true

# Ships no type information; the CEL adapter builds descriptor pools with it.
[[tool.mypy.overrides]]
module = ["google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

# Ships no type information (ADR 0116 pins it exactly); one wrapper,
# `dw_platform.application.json_schema`, is the only importer.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# `-p no:anyio`: async tests and fixtures have one runner, pytest-asyncio in
# auto mode. With anyio's plugin also loaded, the two `pytest_fixture_setup`
# wrappers race in plugin-registration order (the order of site-packages), and
# when anyio wins an async fixture runs on a loop that is not running while the
# test does: three LISTEN/NOTIFY tests timed out on the 2026-09-20 runner image.
# With the plugin off, `--strict-markers` turns any `pytest.mark.anyio` into a
# collection error instead of a race.
addopts = "-q --strict-markers -p no:anyio"
testpaths = [
    "packages/python",
    "apps/api/tests",
    "apps/docgen/tests",
    "apps/worker/tests",
    "tests/e2e",
    "scripts/bench_records_storage",
]
# `tests/e2e`: the marketing pilot's oracle, which `dw_studio`'s
# test_phone_rule.py holds to the platform's phone rule (custom-objects 10).
pythonpath = [
    ".",
    "tests/support",
    "tests/e2e",
    "packages/python/dw_agent_runtime/tests/integration",
]
markers = [
    "unit: fast tests without external services",
    "integration: tests requiring Postgres/Qdrant/Redis/MinIO",
    "contract: API/event/tool schema contract tests",
    "e2e: end-to-end vertical slice tests",
    "eval: evaluation smoke/regression tests",
    "architecture: import-boundary and dependency-rule tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# coverage — measured on src, tests and migrations excluded. `fail_under` is a
# ratchet: it may only be raised, never lowered (target 85%).
# ---------------------------------------------------------------------------
[tool.coverage.run]
# Each src dir is listed separately: pointing at "packages/python" would drop
# never-imported modules under the <pkg>/src/ layout from the denominator.
source = [
    "packages/python/dw_agent_runtime/src",
    "packages/python/dw_connectors/src",
    "packages/python/dw_evals/src",
    "packages/python/dw_kernel/src",
    "packages/python/dw_knowledge/src",
    "packages/python/dw_memory/src",
    "packages/python/dw_observability/src",
    "packages/python/dw_studio/src",
    "packages/python/dw_usage/src",
    "packages/python/dw_platform/src",
    "apps/api/src",
    "apps/docgen/src",
    "apps/worker/src",
]
omit = ["*/tests/*", "*/conftest.py", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true
precision = 1
fail_under = 70

# ---------------------------------------------------------------------------
# import-linter — the architecture rules, enforced rather than documented.
#
# A business context added to this repo extends these lists in the same change
# that creates it: import-linter fails on a module that does not exist, so a
# contract can never be written ahead of the code it governs.
# ---------------------------------------------------------------------------
[tool.importlinter]
include_external_packages = true
root_packages = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_studio",
    "dw_usage",
    "dw_api",
    "dw_docgen",
    "dw_worker",
    # The marketing pilot harness (`tests/e2e`), for its independence contract.
    "tests.e2e.marketing_pilot",
]

[[tool.importlinter.contracts]]
# marketing-pilot R1.2 (MP17): the pilot's harness reaches the platform over its
# public HTTP API only, so a seed or a test there that imports any platform
# package, adapter or not, is a door the API's checks do not stand at.
id = "marketing_pilot_independence"
name = "The marketing pilot harness imports no platform package"
type = "forbidden"
source_modules = ["tests.e2e.marketing_pilot"]
forbidden_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_studio",
    "dw_usage",
    "dw_api",
    "dw_docgen",
    "dw_worker",
]

[[tool.importlinter.contracts]]
name = "Kernel is pure (stdlib only)"
type = "forbidden"
source_modules = ["dw_kernel"]
forbidden_modules = [
    "pydantic",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_usage",
    # The CEL binding (ADR 0114): its import name, read from the installed
    # wheel (FOG-50). The port lives here; the binding never does.
    "cel_expr_python",
]

[[tool.importlinter.contracts]]
name = "Domain layers never import frameworks or providers"
type = "forbidden"
# `dw_studio.*.domain`: each Studio sub-package's domain layer, by pattern
# (import-linter 2.15 reads `*` and `**`, measured 3/11/2026); the registration
# check of `scripts/verify_architecture.py` matches each real one against it.
source_modules = ["dw_platform.domain", "dw_studio.*.domain", "dw_usage.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "langgraph",
    "langchain",
    "qdrant_client",
    "redis",
    "httpx",
    "boto3",
    "minio",
    "openai",
    "anthropic",
    "opentelemetry",
]

[[tool.importlinter.contracts]]
# A workflow node that imports a concrete adapter has a database session or a
# provider client in the middle of a graph — the shape that makes a node
# untestable without infrastructure and makes the tenant filter a node's
# business. Nodes take what they need by injection from the composition root.
#
# dw_agent_runtime.adapters is deliberately NOT forbidden: that is the runtime
# seam (chat model factory, checkpointer), and reaching it is how a node stays
# provider-agnostic rather than how it stops being one.
name = "LangGraph only inside runtime adapters"
type = "forbidden"
source_modules = [
    "dw_agent_runtime.contracts",
    "dw_agent_runtime.ports",
    "dw_agent_runtime.registry",
    "dw_agent_runtime.tools",
    "dw_agent_runtime.executor",
    "dw_agent_runtime.context",
    "dw_agent_runtime.model",
]
forbidden_modules = ["langgraph", "langchain_core", "langchain"]

[[tool.importlinter.contracts]]
name = "Vector/object-storage SDKs only inside knowledge adapters"
type = "forbidden"
source_modules = [
    "dw_knowledge.contracts",
    "dw_knowledge.ports",
    "dw_knowledge.gateway",
    "dw_knowledge.chunking",
    "dw_knowledge.tables",
    "dw_memory",
    "dw_platform",
    "dw_agent_runtime",
]
forbidden_modules = ["qdrant_client", "minio", "boto3"]
# The whole of `dw_memory` is the source, with the one legitimate import named
# here rather than by listing the modules that are NOT adapters — the way the
# knowledge half above does it. Listing is what let this contract go BROKEN on
# main for five CI runs: `dw_memory` was named as a package, the ranker adapter
# was added under it, and the choice was between deleting the rule and weakening
# it. Named this way, a new module under `dw_memory` is covered the day it is
# written, and a second provider import has to be argued for on this line.
ignore_imports = ["dw_memory.adapters.qdrant_ranker -> qdrant_client"]

[[tool.importlinter.contracts]]
# ADR 0007 / channels Z1: what the bot hears decides nothing on its
# own. The self-link flow links and unlinks a chat and replies; it cannot reach
# the approval service or build an access context. Since Z4 the update entry
# (`zalo_inbound`) and the inbound router (`dw_connectors.inbound`) are in it
# too: they hand a linked person's message to commands registered at the
# composition root, which receive a context the PLATFORM built from that
# person's own membership, cut to the command's ceiling (ADR 0005 condition 2).
# None of these modules can build one, read a scope or reach approvals — the
# router's context type is a parameter the composition root binds. Z5's decide
# command is registered the same way. The worker's poll lane is in it too,
# which is why `dw_worker` and `dw_api` are root packages: an app package left
# out of `root_packages` is one import-linter cannot see into.
name = "The Zalo link flow and inbound router cannot reach approvals or access contexts"
type = "forbidden"
source_modules = [
    "dw_connectors.adapters.zalo_link",
    "dw_connectors.adapters.zalo_bot",
    "dw_connectors.adapters.zalo_inbound",
    "dw_connectors.inbound",
    "dw_worker.consumers.zalo_poll",
]
forbidden_modules = ["dw_agent_runtime", "dw_platform", "dw_api"]

[[tool.importlinter.contracts]]
# The settings routes for the same link. Direct imports only: every route
# reaches the approval service and the access-context factory indirectly,
# through the composition root that `RequireAccessContext` resolves the caller
# with. What this forbids is the route itself taking either, so the caller is
# always the bearer token's user and never anything a chat sent.
name = "The Zalo settings routes take neither approvals nor the access-context factory"
type = "forbidden"
source_modules = ["dw_api.routes.v1.zalo"]
forbidden_modules = [
    "dw_agent_runtime",
    "dw_platform.application.identity",
    "dw_api.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Platform packages do not import app composition roots"
type = "forbidden"
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_usage",
]
forbidden_modules = ["dw_api", "dw_worker", "dw_docgen"]

# ---- Usage and limits (ADR-0121 decision 1; usage-and-limits ticket 02) -----

[[tool.importlinter.contracts]]
# The runtime declares `PricingPort` and `UsageRecorderPort`, `dw_usage`
# answers them, and the composition roots wire the two: the runtime and the
# platform never reach into the price book or the ledger directly.
name = "The runtime and the platform do not import dw_usage"
type = "forbidden"
source_modules = ["dw_agent_runtime", "dw_platform"]
forbidden_modules = ["dw_usage"]

[[tool.importlinter.contracts]]
# usage-and-limits R6.1 (ADR-0121 decision 7): the model doors a process hands
# out are metered (`MeteredModelGateway`, `LimitedChatModelFactory`,
# `MeteredEmbeddings`, `MeteredRerank`); the concrete gateway and the concrete
# embedding and rerank adapters are named only by the two builders and the
# composition roots, so no module can reach a model without a lease.
name = "Only a composition root imports a concrete model door"
type = "forbidden"
# `.**` for the two packages that hold a door: a whole root package named as a
# source is blind to imports inside itself (measured on import-linter 2.15,
# 5/11/2026), and those are exactly the second doors this is here to catch.
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime.**",
    "dw_knowledge.**",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_studio",
    "dw_usage",
    "dw_api",
    "dw_docgen",
    "dw_worker",
]
forbidden_modules = [
    "dw_agent_runtime.model.routing",
    "dw_knowledge.adapters.openai_embedding",
    "dw_knowledge.adapters.hash_embedding",
    "dw_knowledge.adapters.cohere_rerank",
]
ignore_imports = [
    "dw_agent_runtime.adapters.model_stack -> dw_agent_runtime.model.routing",
    "dw_knowledge.adapters.embedding_factory -> dw_knowledge.adapters.openai_embedding",
    "dw_knowledge.adapters.embedding_factory -> dw_knowledge.adapters.hash_embedding",
    "dw_api.bootstrap.** -> dw_knowledge.adapters.cohere_rerank",
]
# A route reaches `dw_api.bootstrap` through its container dependency, and
# bootstrap is a composition root: only a direct import is a second door.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Only a composition root (`dw_api.bootstrap`, `dw_worker`) names a `dw_usage`
# adapter; its own layers take them through ports.
name = "dw_usage inner layers never import its adapters"
type = "forbidden"
source_modules = ["dw_usage.domain", "dw_usage.application", "dw_usage.presentation"]
forbidden_modules = ["dw_usage.adapters"]

# ---- Studio (ADR 0100 point 3; studio-skeleton R5) --------------------------
# Patterns rather than lists: import-linter 2.15 reads `*` (one segment) and
# `**` in source, forbidden and ignored modules, and a pattern that matches no
# module yet is not an error (measured 3/11/2026). `scripts/verify_architecture.py`
# fails a direct sub-package of `dw_studio` that one of these does not cover
# (R5.7), so a pattern cannot quietly stop matching.

[[tool.importlinter.contracts]]
name = "Platform core does not import Studio"
type = "forbidden"
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_usage",
]
forbidden_modules = ["dw_studio"]

[[tool.importlinter.contracts]]
# Only a composition root (`dw_api.bootstrap`, `dw_worker`) names a Studio
# adapter; the layers inside Studio take it through a port.
name = "Studio inner layers never import Studio adapters"
type = "forbidden"
source_modules = [
    "dw_studio.*.domain",
    "dw_studio.*.application",
    "dw_studio.*.workflows",
    "dw_studio.*.presentation",
    # A library module beside the layers (workflow-nodes 02): it takes its
    # `ExpressionEngine` as an argument, never the CEL adapter.
    "dw_studio.workflows.templates",
]
forbidden_modules = ["dw_studio.*.adapters"]

[[tool.importlinter.contracts]]
# custom-objects 03 (step 8; R5.6): every record write goes through
# RecordService, so no route, dependency or other package reaches the records
# adapter; `dw_api.bootstrap` and `dw_worker` build it, the test fixtures of
# `dw_studio.testing` plant through it.
name = "Only a composition root imports the records adapter"
type = "forbidden"
source_modules = [
    "dw_api.routes",
    "dw_api.dependencies",
    "dw_api.middleware",
    "dw_studio.core",
    "dw_studio.lifecycle",
    "dw_studio.workflows",
    "dw_studio.agents",
    "dw_platform",
    "dw_agent_runtime",
    "dw_usage",
]
forbidden_modules = ["dw_studio.records.adapters"]
# A route reaches `dw_api.bootstrap` through its container dependency, and
# bootstrap is a composition root: only a direct import is a second door.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# The compilers (`dw_studio.workflows.workflows`, `dw_studio.agents.workflows`)
# are the only exceptions ADR 0100 allows; neither exists yet, so none is
# ignored here. The capability that brings one adds its `ignore_imports` line.
name = "LangGraph only in Studio compilers"
type = "forbidden"
source_modules = ["dw_studio"]
forbidden_modules = ["langgraph", "langchain", "langchain_core"]

[[tool.importlinter.contracts]]
# R5.3: the core every capability builds on imports none of them. Named before
# they exist (a missing forbidden module is not an error, measured 3/11/2026),
# and the registration check fails a new capability this list does not name.
name = "Studio core imports no capability"
type = "forbidden"
source_modules = ["dw_studio.core"]
forbidden_modules = [
    "dw_studio.records",
    "dw_studio.workflows",
    "dw_studio.agents",
    "dw_studio.tools",
    "dw_studio.lifecycle",
]

[[tool.importlinter.contracts]]
# R5.2: the capabilities never import each other; what one needs of another
# reaches it through the core (a registry entry, a port) at the composition root.
name = "Studio capabilities are independent"
type = "independence"
modules = ["dw_studio.records", "dw_studio.lifecycle", "dw_studio.workflows", "dw_studio.agents"]

[[tool.importlinter.contracts]]
# studio-skeleton R5.6; ADR 0114 decision 2: one adapter imports the CEL
# binding, and every other module reaches expressions through
# `dw_kernel.expressions.ExpressionEngine`. Indirect imports are allowed, so a
# composition root that builds `CelCppEngine` has not imported the binding.
name = "CEL binding only in dw_studio.core.adapters.cel"
type = "forbidden"
source_modules = [
    "dw_kernel",
    "dw_platform",
    "dw_agent_runtime",
    "dw_knowledge",
    "dw_memory",
    "dw_connectors",
    "dw_observability",
    "dw_evals",
    "dw_studio",
    "dw_usage",
    "dw_api",
    "dw_docgen",
    "dw_worker",
]
forbidden_modules = ["cel_expr_python"]
ignore_imports = ["dw_studio.core.adapters.cel.** -> cel_expr_python"]
allow_indirect_imports = true
