[project]
name = "dw-usage"
version = "0.1.0"
description = "Usage and limits: the dated price book, the per-call usage ledger and its daily roll-up (ADR-0121)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    # The recorder answers the runtime's `UsageRecorderPort` and the book its
    # `PricingPort`; the runtime declares both and never imports this package.
    "dw-agent-runtime",
    "dw-observability",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "pyyaml>=6.0,<7",
    # `window_for` reads a company's IANA time zone; the slim images and
    # Windows carry no system database, so the zone data travels with the
    # package (ADR-0121 decision 9).
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_usage"]
