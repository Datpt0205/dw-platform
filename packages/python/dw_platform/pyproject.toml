[project]
name = "dw-platform"
version = "0.1.0"
description = "Platform context: tenancy, identity, entitlement, authorization, approval, audit, outbox"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=5,<6",
    # Exact: what a Draft 2020-12 schema accepts is a fact of one release
    # (ADR 0116). The one validator of a work kind's payload and an edited
    # proposal, `dw_platform.application.json_schema`.
    "jsonschema==4.26.0",
    # Imported directly by `application/json_schema.py` (tool schemas: no remote
    # `$ref`, tools-and-skills/01); pinned to the version jsonschema resolves.
    "referencing==0.37.0",
    # Exact: the vault's AES-256-GCM, AES key wrap and HKDF
    # (`application/secrets.py`, `adapters/kms.py`; connections-and-vault 02).
    # The version `uv.lock` already resolved through pyjwt[crypto].
    "cryptography==50.0.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_platform"]
