[project]
name = "dw-studio"
version = "0.1.0"
description = "Studio: tenant-built objects, workflows, agents and tools as versioned data (ADR 0100)"
requires-python = ">=3.12"
dependencies = [
    "dw-kernel",
    "dw-platform",
    # `RunManifestPort` and the pinned types it returns (tenant-config 04): the
    # runtime declares the port, Studio satisfies it.
    "dw-agent-runtime",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_studio"]
