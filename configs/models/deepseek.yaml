schema_version: "2.0"
profile_id: deepseek
routing_policy_version: "1.1.0"
# Data route (ADR-0123 decision 5): every route here is `foreign` until FOG-18
# locates the alias it names; `vn` needs that answer cited in this comment.
# `retention_days: null` says the processor's retention is not known.
# DeepSeek speaks the OpenAI-compatible dialect. Enable with:
#   DW_MODEL_PROVIDER=openai_compatible
#   OPENAI_BASE_URL=https://api.deepseek.com
#   OPENAI_API_KEY=sk-...
#   DW_API_OPENAI_STRUCTURED_MODE=json_object   (DeepSeek lacks json_schema)
#   DW_API_MODEL_PROFILE=deepseek
structured_extraction:
  provider: openai_compatible
  model: deepseek-chat
  data_location: foreign
  processor: deepseek
  retention_days: null
  no_training: false
  timeout_seconds: 60
reasoning:
  provider: openai_compatible
  model: deepseek-chat
  data_location: foreign
  processor: deepseek
  retention_days: null
  no_training: false
  timeout_seconds: 120
# Visible thinking (chat front office): deepseek-reasoner returns
# reasoning_content; slower — only used with route_kind=deep_reasoning.
deep_reasoning:
  provider: openai_compatible
  model: deepseek-reasoner
  data_location: foreign
  processor: deepseek
  retention_days: null
  no_training: false
  timeout_seconds: 240
