# The audit actions workflow-engine writes, with their Vietnamese labels: this
# spec's fragment of the action catalogue telemetry-and-audit merges
# (telemetry-and-audit R1.6; H-21).
schema_version: "1.0"
copy_id: platform.audit_actions.workflow_engine
version: "1.2.0"
actions:
  # workflow-engine/02: a Studio run queued by its one door.
  run.started: "Lượt chạy được xếp vào hàng"
  # workflow-engine/03: the node wrapper met the run's deadline, as `system:studio_runs`.
  run.deadline_exceeded: "Lượt chạy bị dừng vì quá hạn chót"
  # workflow-engine/04: the reaper dead-letters a run whose worker died a fifth
  # time, as `system:studio_run_reaper`; `run.deadline_exceeded` is written by
  # the reaper too.
  run.dead_lettered: "Lượt chạy dừng hẳn sau năm lần lỗi tiến trình"
  # workflow-engine/05: a run taken again that fails its resume checks, or has
  # nothing to resume with, as `system:studio_runs`; and the person whose
  # resume check queued it again.
  run.blocked: "Lượt chạy bị chặn khi tiếp tục"
  run.unblocked: "Lượt chạy được kiểm lại và xếp lại vào hàng"
