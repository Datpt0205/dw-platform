# Mutation check of compliance-pdpl ticket 03: scripts/mutate.py runs this file
# at the queue's close (.claude/rules/wave-close.md). One mutation per row of
# the ticket's controls (CP2, CP3, CP4, CP5, R2.1, R2.8), each named after the
# guard it removes, with the tests that must go red.
mutations:
  # ---- CP2, CP3: the gate at every door ---------------------------------------
  - name: the structured gateway sends without asking the gate
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/model/routing.py
    old: "        attempts = await self.residency.admitted(run_context, every_attempt)"
    new: "        attempts = every_attempt"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_a_vn_only_run_never_reaches_a_foreign_route
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_a_studio_run_s_pinned_foreign_route_is_refused
  - name: the structured gateway checks only the first route
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/model/routing.py
    old: "        attempts = await self.residency.admitted(run_context, every_attempt)"
    new: "        attempts = (await self.residency.admitted(run_context, every_attempt[:1])) + every_attempt[1:]"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_a_failing_vn_route_does_not_fall_through_to_a_foreign_fallback
  - name: a refused fallback ends the run on the vn route's error, not refused
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/model/routing.py
    old: "        if len(attempts) < len(every_attempt):"
    new: "        if False:"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_a_failing_vn_route_does_not_fall_through_to_a_foreign_fallback
  - name: the agent loop's middleware admits every route
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/residency_middleware.py
    old: "        admitted = await self._gate.admitted(run_context, resolved.attempts)"
    new: "        admitted = list(resolved.attempts)"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_the_agent_loop_refuses_a_foreign_chat_route_before_the_model
      - packages/python/dw_agent_runtime/tests/unit/test_agent_factory.py::test_the_full_stack_holds_every_property
  - name: the platform stack carries no residency middleware
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/agent_factory.py
    old: "        ResidencyGateMiddleware(spec.residency, spec.models, spec.profile_id),"
    new: ""
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_the_platform_stack_puts_the_gate_after_the_freeze_and_before_the_limits
      - packages/python/dw_agent_runtime/tests/unit/test_agent_factory.py::test_the_full_stack_holds_every_property
  - name: a delegated turn carries no residency middleware
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/sub_agents.py
    old: "        ResidencyGateMiddleware(parent.residency, parent.models, profile_id),"
    new: ""
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_residency_gate.py::test_a_delegated_turn_asks_the_gate_at_its_own_model_call
  - name: compaction summarises without asking the gate
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/context_compaction.py
    old: "            await self._residency.check(run_context, summary_route)"
    new: "            pass"
    tests:
