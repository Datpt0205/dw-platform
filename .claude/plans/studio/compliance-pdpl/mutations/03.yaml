      - packages/python/dw_platform/tests/integration/test_residency_db.py::test_another_tenant_s_workspace_is_never_read_and_the_gate_refuses
      - packages/python/dw_platform/tests/integration/test_residency_db.py::test_a_strange_value_in_the_tenant_row_refuses
  - name: the loosest class wins
    file: packages/python/dw_kernel/src/dw_kernel/residency.py
    old: "    return min(classes, key=_STRICTNESS.__getitem__)"
    new: "    return max(classes, key=_STRICTNESS.__getitem__)"
