# Mutation check of workflow-engine ticket 04: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's criteria: the refusal table at dispatch (`StudioAdmission`, tested
# at the lane on PostgreSQL as well as in memory), the claim and the reaper
# (`SqlStudioRunQueue` under each tenant's RLS), the fence on the row and on the
# checkpoint saver, the lane's heartbeat and orderly shutdown, the deadline,
# the dead letter and its reader, and the outcomes (failure-modes #5: each test
# calls the code where the effect happens). A sample was broken by hand on
# 5/11/2026, each red (named in the ticket's Comments). The migration's
# mutations apply in place, so their tests recreate the database from the
# mutated revision; the scan's mutates in place (a scan cannot see a package
# copy).
