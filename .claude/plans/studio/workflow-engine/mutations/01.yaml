    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/ir.py
    old: "        if spec is not None and spec.exits_loop:\n"
    new: "        if False:\n"
    tests:
      - packages/python/dw_studio/tests/unit/test_workflow_kind.py::test_a_step_after_a_break_in_a_loop_body_is_unreachable
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_loop_body_returns_to_its_loop_and_a_break_leaves_it
  - name: R2.1 ends_run has a default
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/registry.py
    old: "    # to the loop's join. A step after either in its lane is unreachable.\n    ends_run: bool\n"
    new: "    # to the loop's join. A step after either in its lane is unreachable.\n    ends_run: bool = False\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_type_that_forgets_one_of_the_four_cannot_be_built
