# Mutation check of workflow-engine ticket 01: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's rows (WE14, WE36) and per rule its criteria name (R1.1, R1.3-R1.6,
# R1.8, R2.1, R2.2, R2.5, R2.10-R2.13), each test calling the place where the
# effect happens: the core's `validate` and `lower`, the kind's own `validate`
# and `extract`, its publish hook on a real store transaction, the envelope's
# seal and the real routes. The suites passed on their first run, so a set of
# these was applied by hand on 5/11/2026, each red (named in the ticket's
# Comments). The migration's mutation applies in place, so its tests recreate
# the database from the mutated revision; the scans' mutate the test file in
# place (a scan cannot see a package copy), and the run key's scan mutates
# `kinds.py` in place for the same reason.
mutations:
  # ---- WE14, R2.12: one lowering ---------------------------------------------
  - name: WE14 the lowering skips the error lane
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/ir.py
    old: "    if isinstance(error, list):\n"
    new: "    if False:\n"
    tests:
      - packages/python/dw_studio/tests/unit/test_workflow_kind.py::test_an_error_lane_nested_in_an_approved_lane_is_lowered
      - packages/python/dw_studio/tests/unit/test_workflow_kind.py::test_every_step_at_every_depth_is_extracted
  - name: WE14 the compiler builds no lane from the IR
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/compile.py
    old: "        return self.ir.lanes_of(self._index[step.id])\n"
    new: "        return {}\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_lead_care_compiles_to_the_graph_it_compiled_to_before_the_ir
  - name: R2.12 the one-owner scan finds no lowering
    file: packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py
    old: '    "def lower(": r"^def lower\(",'
    new: '    "def lower(": r"^def lowered\(",'
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_dw_workflow_v1_has_one_model_ir_validator_table_and_compiler
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_second_validator_in_studio_is_seen
  - name: R2.12 the lane scan does not see a `.lanes(` call
    file: packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py
    old: '                    and node.func.attr == "lanes"'
    new: '                    and node.func.attr == "lanes_never"'
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_lane_read_in_the_compiler_is_seen
  # ---- R2.11: the one table ----------------------------------------------------
  - name: R2.11 the code scan sees no code
    file: packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py
    old: "_CODE = re.compile(r\"[\\\"'](wf\\.[a-z_]+)[\\\"']\")"
    new: '_CODE = re.compile(r"(?!)")'
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_code_outside_the_table_is_seen
  - name: Gate MEDIUM (a) a case value is not escaped as a pointer segment
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/ir.py
    old: '    return str(text).replace("~", "~0").replace("/", "~1")'
    new: "    return str(text)"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_workflow_ir.py::test_a_case_value_with_a_slash_is_one_pointer_segment
  # ---- R2.1: what the lowering reads of a type -----------------------------------
  - name: R2.1 a step that ends the run still leads on
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/ir.py
    old: "        if spec is not None and spec.ends_run:\n            return\n"
    new: ""
    tests:
