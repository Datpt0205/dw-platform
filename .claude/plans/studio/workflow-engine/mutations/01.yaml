      - packages/python/dw_studio/tests/unit/test_workflow_kind.py::test_a_loop_needs_its_body_and_not_its_max_reached_lane
  - name: R2.2 a loop must carry max_reached
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/validate.py
    old: '_OPTIONAL_PORTS = frozenset({"max_reached"})'
    new: "_OPTIONAL_PORTS: frozenset[str] = frozenset()"
    tests:
