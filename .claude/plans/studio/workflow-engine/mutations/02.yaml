# Mutation check of workflow-engine ticket 02: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's "Kiểm soát" rows (WE1, WE18-WE21, WE49-WE51) and per rule of the
# door, the migration and the scans, each test calling the door where the
# effect happens: `RunRequestService` directly (never a route), the columns as
# dw_app SQL (failure-modes #5). The door's and the migration's suites passed
# on their first run, so 22 of these were applied by hand on 4/11/2026, each
# red (named in the ticket's Comments). The migration's
# mutations apply in place, so their tests recreate the database from the
# mutated revision; the scans' mutate the test file in place (a scan cannot
# see a package copy).
