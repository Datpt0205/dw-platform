# Mutation check of workflow-engine ticket 03: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's criteria and per rule of the wrapper, the door, the migration and
# the scans, each test calling the code where the effect happens: the node
# wrapper on LangGraph (in-memory saver), `RunRequestService` and
# `LangGraphWorkflowRunner.run_studio` against PostgreSQL, the columns and
# triggers as dw_app SQL (failure-modes #5). A sample was broken by hand on
# 5/11/2026, each red (named in the ticket's Comments). The migration's
# mutations apply in place, so their tests recreate the database from the
# mutated revision; the scans' mutate in place (a scan cannot see a package
# copy).
mutations:
  # ---- the wrapper's outcomes (R4.23, R4.24, R4.30, R6.28) -----------------------
  - name: R4.24 an outcome nobody knows is retried
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/node_wrapper.py
    old: "        return Failure(\"outcome_unknown\", message, unknown=True)\n    if isinstance(exc, NotDispatchedError):"
    new: "        return Failure(\"outcome_unknown\", message, retryable=True)\n    if isinstance(exc, NotDispatchedError):"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_studio_node_wrapper.py::test_outcome_unknown_is_never_retried_routed_or_followed
      - packages/python/dw_studio/tests/workflows/test_workflow_run_parts.py::test_every_reference_document_gives_its_golden_trace
