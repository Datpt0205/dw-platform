# Mutation check of workflow-engine ticket 05: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's criteria: the wait table and its two triggers (PostgreSQL holds the
# state machine, the composite key and the cancel on every run end), the one
# wait path (`SqlRunWaits.open`, the node wrapper's open in one transaction
# with its step run), the decision's handler and its two conditional writes,
# the park that reads a decision made first, the five checks and the deadline
# before them, the empty resume, the compaction and the live scopes. The
# migration's mutations apply in place, so their tests recreate the database
# from the mutated revision.
#
# Left out, with why: R6.9 (the run keeps its pinned version and mode) has no
# line to break, the take reads both from the run's own row and manifest;
# R6.10 (no secret in a checkpoint or a wait) has no runtime path that carries
# a connection's secret into a Studio run's state in W1, so no mutation of
# this ticket's code can put one there (its test watches the rows for when a
# connection door joins, connections-and-vault).
mutations:
  # ---- R6.1, R6.15, R6.40: the table ------------------------------------------------
  - name: R6.15 the run key is a single column
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "            FOREIGN KEY (tenant_id, run_id)\n            REFERENCES platform.worker_runs (tenant_id, id) ON DELETE CASCADE,\n"
    new: "            FOREIGN KEY (run_id)\n            REFERENCES platform.worker_runs (id) ON DELETE CASCADE,\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_15_a_wait_never_names_another_companys_run
  - name: R6.1 the run key restricts the delete instead of cascading
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "REFERENCES platform.worker_runs (tenant_id, id) ON DELETE CASCADE,\n"
    new: "REFERENCES platform.worker_runs (tenant_id, id) ON DELETE RESTRICT,\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_1_deleting_a_companys_runs_takes_its_waits_and_spares_the_rest
  - name: R6.1 the kind check takes any kind
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "            CHECK (kind IN ('approval', 'incident', 'outcome_review', 'child_run')),\n"
    new: "            CHECK (kind <> ''),\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_1_the_kind_check_takes_every_w1_kind_and_refuses_another
  - name: R6.1 dw_app may update every column
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "    (\"dw_app\", \"GRANT UPDATE (status, resolved_at, resolution) ON platform.run_waits TO dw_app;\"),\n"
    new: "    (\"dw_app\", \"GRANT UPDATE ON platform.run_waits TO dw_app;\"),\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_1_dw_app_moves_only_the_resolution_columns
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_a_run_wait_is_opened_and_moved_only_by_its_resolution_columns
  - name: R6.40 the transition guard lets a wait move back
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "            (OLD.status = 'open' AND NEW.status IN ('resolved', 'cancelled'))\n            OR (OLD.status = 'resolved' AND NEW.status = 'consumed')\n"
    new: "            true\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_40_a_wait_moves_only_forward_and_resolves_once
  - name: R6.40 a resolution is rewritten
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "        IF (OLD.resolution IS NOT NULL AND NEW.resolution IS DISTINCT FROM OLD.resolution)\n"
    new: "        IF false\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_40_a_wait_moves_only_forward_and_resolves_once
  - name: R6.40 a resolved wait without its resolution
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "            (status IN ('resolved', 'consumed')) = (resolution IS NOT NULL)\n            AND "
    new: "            "
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_40_a_wait_moves_only_forward_and_resolves_once
  # ---- R6.13: every run end cancels the open waits ----------------------------------
  - name: R6.13 the cancel trigger is gone
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "    \"CREATE TRIGGER worker_runs_cancel_run_waits\"\n    \" AFTER UPDATE OF status ON platform.worker_runs FOR EACH ROW\"\n    f\" WHEN (NEW.status IN ({_FINISHED}) AND OLD.status IS DISTINCT FROM NEW.status)\"\n    \" EXECUTE FUNCTION platform.cancel_run_waits()\",\n"
    new: ""
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_13_a_run_that_ends_cancels_every_open_wait_in_the_same_transaction
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r7_1_the_golden_trace_of_a_run_cancelled_while_it_waits
  - name: R6.13 the cancel function runs as the caller
    file: db/migrations/versions/25e271c4c20a_run_waits_and_the_resume_check_.py
    old: "    CREATE FUNCTION platform.cancel_run_waits() RETURNS trigger\n    LANGUAGE plpgsql\n    SECURITY DEFINER\n"
    new: "    CREATE FUNCTION platform.cancel_run_waits() RETURNS trigger\n    LANGUAGE plpgsql\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_13_a_cross_tenant_lane_with_no_tenant_setting_still_cancels_the_waits
  # ---- R6.1, R6.37: the one wait path --------------------------------------------------
  - name: R6.1 open never hands back the open row
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/run_waits.py
    old: "        found = await self._unused(session, pair)\n        if found is not None:\n            return found\n"
    new: ""
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_1_open_again_hands_back_the_open_row_and_a_second_park_gets_a_new_id
  - name: R6.37 the step run waits outside the wait's transaction
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/testing/step_recorder.py
    old: "        if callable(on_commit):\n"
    new: "        if False:\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_waits.py::test_a_wait_whose_transaction_rolls_back_leaves_no_row_and_no_step_run
  - name: R6.37 one reason code for every kind
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/node_wrapper.py
    old: "                reason_code=WAIT_REASONS[wait.kind],\n"
    new: "                reason_code=\"approval_pending\",\n"
    tests:
