  # ---- R6.2, R6.3, R6.6: the decision -------------------------------------------------
  - name: R6.2 decide announces a step decision instead of handing it over
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/approval_flow.py
    old: "                handler = self._decided_handler(request.approval_type)\n"
    new: "                handler = None\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_approval_flow.py::test_a_decided_handler_moves_it_in_the_transaction_and_announces_nothing
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_2_r6_3_a_step_decision_resolves_the_wait_and_the_worker_goes_on
  - name: R6.6 the wait is resolved whatever its status
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/run_waits.py
    old: "                run_waits.c.interrupt_id == interrupt_id,\n                run_waits.c.status == \"open\",\n"
    new: "                run_waits.c.interrupt_id == interrupt_id,\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_6_a_decision_on_a_wait_no_longer_open_is_refused_and_rolled_back
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_6_two_concurrent_decisions_have_exactly_one_winner
  - name: R6.6 a run neither waiting nor running takes the decision
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/run_waits.py
    old: "        if status != RunStatus.RUNNING.value:\n            raise stale_interrupt(run_id, interrupt_id)\n"
    new: ""
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_6_a_failed_run_whose_wait_is_still_open_refuses_the_decision
  - name: R6.3 the park ignores a decision made first
    file: packages/python/dw_studio/src/dw_studio/core/adapters/studio_runs.py
    old: "            decided = any(r.status == \"resolved\" and r.interrupt_id not in used for r in held)\n"
    new: "            decided = False\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_1_a_decision_between_the_open_and_the_park_queues_the_run
  # ---- R6.4, R6.5, R6.7, R6.8, R6.16: a run taken again ---------------------------------
  - name: R6.4 the waits a pass resumed are never consumed
    file: packages/python/dw_studio/src/dw_studio/core/adapters/studio_runs.py
    old: "    if not consumed:\n        return\n"
    new: "    return\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_4_two_waits_in_series_resume_each_with_its_own_resolution
  - name: R6.5 an empty resume runs the graph
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/langgraph_runner.py
    old: "                INCOMPATIBLE_RESUME if resume.failed else EMPTY_RESUME if resume.empty else None\n"
    new: "                INCOMPATIBLE_RESUME if resume.failed else None\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_waits.py::test_a_resume_with_nothing_resolved_is_blocked_empty_resume_without_the_graph
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_5_a_resume_with_nothing_resolved_is_blocked_with_its_audit
  - name: R6.7 (a) the compiler and the types are not checked
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/resume.py
    old: "        failed.append(\"a\")\n"
    new: "        pass\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_waits.py::test_each_engine_check_fails_on_its_own_pin
  - name: R6.7 (b) the waiting node is not checked
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/resume.py
    old: "        failed.append(\"b\")\n"
    new: "        pass\n"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_waits.py::test_check_b_fails_on_a_node_that_is_not_the_waits
      - packages/python/dw_studio/tests/integration/test_run_waits_db.py::test_r6_8_a_waiting_node_renamed_by_the_build_blocks_the_resume
  - name: R6.7 (c) the state schema is not checked
