# Mutation check of connections-and-vault ticket 04: scripts/mutate.py runs this
# file at the queue's close (wave-close.md). One mutation per control the ticket
# adds (CV12-CV15, CV21, CV24, CV28, CV31; R1.15, R5.1-R5.21), and one per
# layer where a control is held twice (the status rule in the trigger and in
# the settler; the share scope in the route's schema and in the service; the
# strict prefix in the API and the worker; the fingerprint in the dependency
# and in the route's declaration).
#
# Shown red by hand, not here (2026-11-04, the file backed up first and put
# back byte for byte): the permission scan (`test_permission_catalogue.py` (c))
# with `CONNECTIONS_USE_SCOPE` renamed away from `*_SCOPE` in connections.py,
# because a source scan cannot see mutate.py's package copy.
# Not expressible as one replacement: "the rule refuses every run requested
# before the newest version" (R5.17), held by
# test_a_rotation_alone_stops_no_run; and the request's `created_at` read
# after the row lock (M11), a race no single-process test reaches.
mutations:
  # ---- R5.6 (CV15): the transition table, the database's ------------------------
  - name: R5.6 a connection may be inserted disabled
    file: db/migrations/versions/388a31c46bdf_connections_status_rules_and_revocation_.py
    old: "            IF NEW.status NOT IN ('pending', 'active') THEN\n"
    new: "            IF NEW.status NOT IN ('pending', 'active', 'disabled') THEN\n"
    tests:
      - packages/python/dw_platform/tests/integration/test_connections_db.py::test_a_connection_is_never_inserted_disabled
  - name: R5.6 the transition table checks nothing
    file: db/migrations/versions/388a31c46bdf_connections_status_rules_and_revocation_.py
    old: "        IF NOT (\n            (OLD.status = 'pending'"
    new: "        IF false AND NOT (\n            (OLD.status = 'pending'"
    tests:
      - packages/python/dw_platform/tests/integration/test_connections_db.py::test_the_status_trigger_refuses_a_move_off_its_table
  - name: R5.6 disabled_at is not stamped
    file: db/migrations/versions/388a31c46bdf_connections_status_rules_and_revocation_.py
    old: "            NEW.disabled_at := now();\n"
    new: "            NULL;\n"
    tests:
      - packages/python/dw_platform/tests/integration/test_connections_db.py::test_disabling_stamps_disabled_at

