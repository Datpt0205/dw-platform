# Mutation check of connections-and-vault ticket 03: scripts/mutate.py runs this
# file at the queue's close (wave-close.md). One mutation per control the ticket
# adds (CV7-CV11, CV19, CV22, CV26, CV29, CV30; R3.1-R3.21, R4.1-R4.4), and one
# per layer where a control is held twice (the pattern rule in the API and the
# CHECK; the strict prefix in the API and the worker; the composition root of
# each process).
#
# Shown red by hand, not here, because a source scan cannot see mutate.py's
# package copy (2026-11-04, each probe file deleted afterwards):
# - R3.6 (CV9): a module `dw_connectors/adapters/lane1_probe.py` calling
#   `httpx.AsyncClient()` turned
#   test_egress_architecture.py::test_no_module_but_egress_and_the_listed_adapters_builds_a_raw_client
#   red;
# - R3.13: a class `EgressDenied(DWError)` in `dw_connectors/egress/` turned
#   test_egress_architecture.py::test_egress_declares_no_error_class_of_its_own
#   red, and a module of `dw_connectors` importing `dw_agent_runtime.dispatch`
#   turned test_egress_architecture.py::test_connectors_never_import_the_agent_runtime
#   red.
# Not expressible as one replacement: "write the row at POST" (R3.9) and "let
# egress retry after a reset" (R3.15); the first is held by the row counts of
# test_a_host_is_allowed_only_once_a_second_person_approves_it, the second by
# the request count of test_a_reset_after_the_request_is_unknown_and_never_sent_again.
