    new: "                    host,\n"
    tests:
      - packages/python/dw_connectors/tests/unit/test_egress_client.py::test_the_connection_goes_to_the_address_that_was_checked_and_tls_to_the_name
  - name: R3.2 resolve_checked bypassed
    file: packages/python/dw_connectors/src/dw_connectors/egress/network.py
    old: "                resolve_checked, host, port, allow_private=self._allow_private\n"
    new: "                lambda h, p: [str(i[4][0]) for i in __import__('socket').getaddrinfo(h, p)], host, port\n"
    tests:
      - packages/python/dw_connectors/tests/unit/test_egress_client.py::test_an_address_that_is_not_global_is_refused_before_any_connection
      - apps/api/tests/unit/test_egress_composition.py::test_deployed_a_listed_host_that_answers_a_private_address_is_refused
  - name: R3.2 the API opens private addresses when deployed
    file: apps/api/src/dw_api/bootstrap/egress.py
