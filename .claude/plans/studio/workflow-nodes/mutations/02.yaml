# Mutation check of workflow-nodes ticket 02: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control the ticket adds
# (R1.1, R1.2, R1.4/WN15, R1.5, R4.1, R4.2/WN2, R4.3/WN13, WN1) and per check
# of the template builder, as the ticket's "Gỡ từng phép kiểm → ca của nó đỏ"
# asks.
#
# Two are guarded by a test that scans source files by path (the one
# registry, the formatter scan): mutate.py's package copy is invisible to such
# a test, so they run in place. They are marked `# in place` and were shown
