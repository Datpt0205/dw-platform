# Mutation check of org-and-principals ticket 03: scripts/mutate.py runs this file.
# One mutation per control (R6.1-R6.6, R6.8-R6.20, R7.1, R7.2; OP8-OP11, OP14-OP18)
# and per layer that holds one: the guards and functions of migration
# 557e6907195e (and the two objects of be93e0c26a4c it reads, R6.3 and R6.10),
# the service-account service and its binding guard, the adapters, the DW
# standing and second person, the work lane's claim, the offboarding step. A
# mutation of a migration needs no reset: each suite recreates its database
# from the migrations at session start.
#
# Run at the queue's close (wave-close.md), not per ticket. Two were shown red
# by hand while building (3/11/2026): the DW creation's lock moved below the
# company row turns the interleaving test into a real 40P01 ("deadlock
# detected"), and the `principal_inactive` branch removed puts a DW with a
# suspended principal into operation (DID NOT RAISE ConflictError).
# `test_user_reads.py` scans source by path, which mutate.py's package copy
# hides, so its mutations (HUMAN removed from a people list) run in place by
# hand; one was shown red so on 3/11/2026.
