# Mutation check of org-and-principals ticket 04: scripts/mutate.py runs this file.
# One mutation per control (R8.1-R8.4; OP12, OP13): the validator's rules in the
# domain, the port's tenant filter, the API handler, and each clause of
# `platform.audience_matches`. A mutation of the migration needs no reset: each
# suite recreates its database from the migrations at session start.
mutations:
  # R8.1 / OP12 ---------------------------------------------------------------
  - name: R8.1 an empty audience is not refused as empty
    file: packages/python/dw_platform/src/dw_platform/domain/audience.py
    old: "    if not conditions and not problems:"
    new: "    if False:"
    tests:
      - packages/python/dw_platform/tests/unit/test_audience.py::test_a_document_naming_no_condition_is_empty_and_never_reaches_the_database
  # R8.2 / OP12 ---------------------------------------------------------------
  - name: R8.2 an unknown kind of condition is called malformed
    file: packages/python/dw_platform/src/dw_platform/domain/audience.py
    old: "    return isinstance(value, dict) and len(value) == 1 and next(iter(value)) not in CONDITION_KINDS"
    new: "    return False"
    tests:
      - packages/python/dw_platform/tests/unit/test_audience.py::test_a_condition_of_another_kind_is_unsupported_not_malformed
  - name: R8.2 a twenty-first condition is accepted
    file: packages/python/dw_platform/src/dw_platform/domain/audience.py
    old: "    if len(conditions) > MAX_CONDITIONS:"
    new: "    if False:"
    tests:
      - packages/python/dw_platform/tests/unit/test_audience.py::test_the_twenty_first_condition_is_one_too_many
      - packages/python/dw_platform/tests/unit/test_audience.py::test_twenty_conditions_across_groups_are_accepted_and_twenty_one_are_not
  - name: R8.2 an empty group beside a real one is accepted
    file: packages/python/dw_platform/src/dw_platform/domain/audience.py
    old: "            if all_of == []"
    new: "            if False"
    tests:
      - packages/python/dw_platform/tests/unit/test_audience.py::test_an_empty_group_beside_a_real_one_is_refused
  - name: R8.2 an unknown workspace is accepted
    file: packages/python/dw_platform/src/dw_platform/application/audience.py
    old: "            if workspace_id not in known"
    new: "            if False"
    tests:
      - packages/python/dw_platform/tests/unit/test_audience.py::test_a_workspace_the_port_does_not_know_is_refused_at_each_condition_naming_it
  - name: R8.2 the port leaves the tenant to RLS
    file: packages/python/dw_platform/src/dw_platform/adapters/persistence/audience_workspaces.py
    old: "            workspaces.c.tenant_id == context.tenant_id,\n"
    new: ""
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_another_tenants_workspace_and_a_missing_one_are_the_same_refusal
  - name: R8.2 the handler drops the problems
    file: apps/api/src/dw_api/exception_handlers.py
    old: "                ProblemError(pointer=problem.pointer, code=problem.code, detail=problem.detail)\n                for problem in exc.problems\n"
    new: "                ProblemError(pointer=problem.pointer, code=problem.code, detail=problem.detail)\n                for problem in exc.problems[:0]\n"
    tests:
      - apps/api/tests/unit/test_audience_errors.py
  # R8.3 ----------------------------------------------------------------------
  - name: R8.3 one condition of a group is enough
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: |2
                          ELSE NOT EXISTS (
                              SELECT 1
                              FROM jsonb_array_elements(g.grp -> 'all_of') AS c(cond)
                              WHERE NOT CASE
    new: |2
                          ELSE EXISTS (
                              SELECT 1
                              FROM jsonb_array_elements(g.grp -> 'all_of') AS c(cond)
                              WHERE CASE
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_a_document_matches_when_one_group_matches_and_a_group_needs_every_condition
  # R8.4 / OP13 ---------------------------------------------------------------
  - name: R8.4 a member who is not active matches
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "              AND tm.status = 'active'\n"
    new: ""
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_a_member_who_is_not_active_matches_nothing
  - name: R8.4 the tenant asked is not compared with the transaction's
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "        NOT (p_tenant_id IS DISTINCT FROM NULLIF(current_setting('app.tenant_id', true), '')::uuid)\n        AND EXISTS ("
    new: "        EXISTS ("
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_another_tenants_audience_is_never_answered_from_this_tenants_transaction
      - packages/python/dw_platform/tests/integration/test_audience.py::test_no_tenant_in_the_transaction_matches_nothing
  - name: R8.4 the company member row is not filtered by tenant
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "            WHERE tm.tenant_id = p_tenant_id\n              AND tm.user_id = p_user_id\n"
    new: "            WHERE tm.user_id = p_user_id\n"
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_standing_in_another_tenant_does_not_make_a_suspended_member_active
  - name: R8.4 the memberships are not filtered by tenant
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "                                WHERE m.tenant_id = p_tenant_id\n                                  AND m.user_id = p_user_id\n"
    new: "                                WHERE m.user_id = p_user_id\n"
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_a_straddler_matches_by_the_tenant_asked_only
  - name: R8.4 an empty group is true for everyone
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "                    WHEN jsonb_array_length(g.grp -> 'all_of') = 0 THEN false"
    new: "                    WHEN jsonb_array_length(g.grp -> 'all_of') = 0 THEN true"
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_a_bad_document_is_false_and_never_an_error
      - packages/python/dw_platform/tests/integration/test_audience.py::test_an_empty_group_beside_a_real_one_is_not_true_for_everyone
  - name: R8.4 a value that is not a uuid reaches the cast
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: "                            WHEN (c.cond ->> 'workspace_subtree') !~ '{_UUID}' THEN false\n"
    new: ""
    tests:
      - packages/python/dw_platform/tests/integration/test_audience.py::test_a_bad_document_is_false_and_never_an_error
  # Step 3: who may call it ---------------------------------------------------
  - name: step 3 PUBLIC keeps EXECUTE
    file: db/migrations/versions/555dad01f629_platform_audience_matches.py
    old: '    op.execute(f"REVOKE ALL ON FUNCTION {SIGNATURE} FROM PUBLIC")'
    new: "    pass"
    tests:
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_only_dw_app_may_ask_who_is_in_an_audience
