# Mutation check of custom-objects ticket 02: scripts/mutate.py runs this file at
# the queue's close (wave-close.md). One mutation per control of the ticket's
# "Kiểm soát" rows (CO1-CO6, CO21, CO23-CO25) and per layer that holds one. Run
# by hand while writing the tests (4/11/2026; every new suite passed on its first
# run), each red in its named case. The slot UNIQUE is CO4's second wall behind
# the hook's lock, so it has a test of its own (failure-modes #3). The
# migration's mutations apply in place, so their tests recreate the database from
# the mutated revision. CO21 and the partition policies are planted and named in
# `test_rls_coverage.py` itself; CO5's CHECK in `assert_field_tables_classified`.
mutations:
  - name: R1.8 CO23 a mixed change counts as tighten-only
    file: packages/python/dw_studio/src/dw_studio/records/domain/rules.py
    old: and all(difference.tightens for difference in self.differences)
    new: and any(difference.tightens for difference in self.differences)
    tests:
      - packages/python/dw_studio/tests/unit/test_object_rules.py::test_r1_8_tighten_only_holds_exactly_when_every_change_tightens
      - packages/python/dw_studio/tests/unit/test_object_rules.py::test_r1_8_securing_phone_alone_tightens_and_with_a_label_does_not
  - name: R3.7 CO1 the projector's cache key drops the tenant
    file: packages/python/dw_studio/src/dw_studio/records/application/schema_projector.py
    old: "    return (tenant_id, object_id, schema_version)"
    new: "    return (uuid.UUID(int=0), object_id, schema_version)"
    tests:
      - packages/python/dw_studio/tests/unit/test_schema_projector.py::test_co1_two_companies_with_one_object_id_each_get_their_own
  - name: R3.7 the projector never hits its cache
    file: packages/python/dw_studio/src/dw_studio/records/application/schema_projector.py
    old: "        if cached is not None:"
    new: "        if False:"
    tests:
      - packages/python/dw_studio/tests/unit/test_schema_projector.py::test_a_hit_reads_nothing_and_the_oldest_entry_leaves
  - name: R3.7 CO25 ai_description goes into the schema's description
    file: packages/python/dw_studio/src/dw_studio/records/application/schema_projector.py
    old: '    return value if field.required else {"anyOf": [value, {"type": "null"}]}'
    new:
      "    if field.ai_description:\n        value[\"description\"] = field.ai_description\n    return\
      \ value if field.required else {\"anyOf\": [value, {\"type\": \"null\"}]}"
    tests:
      - packages/python/dw_studio/tests/unit/test_schema_projector.py::test_co25_a_description_is_data_beside_the_schema_never_in_it
  - name: R2.5 CO24 a sensitive field may be open
    file: packages/python/dw_studio/src/dw_studio/records/domain/rules.py
    old: 'if field.pd_category is PdCategory.SENSITIVE and field.access_mode == "open":'
    new: "if False:"
