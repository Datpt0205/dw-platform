    new: "tx.envelope, artifact_id, kind=kind, key=lambda e: e.read_key, lock=False"
    tests:
      - apps/api/tests/integration/test_kill_api.py::test_r8_1_a_reader_without_the_key_is_403
  - name: AL16 R8.1 the kill reads the component without the depth of open_for
    file: packages/python/dw_studio/src/dw_studio/lifecycle/application/kill.py
    old: |2
              row, _ = await self.artifacts.open_for(
                  tx.envelope, artifact_id, kind=kind, key=_kill_key, lock=False
              )
              return row
    new: |2
              row = await tx.envelope.artifact(artifact_id)
              assert row is not None
              return row
    tests:
      - apps/api/tests/integration/test_kill_api.py::test_al16_another_company_or_another_workspace_is_404_and_writes_nothing
      - apps/api/tests/integration/test_kill_api.py::test_al16_a_workflow_under_the_agents_segment_is_404
