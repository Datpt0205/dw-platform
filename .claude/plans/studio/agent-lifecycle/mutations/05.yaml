# Mutation check of agent-lifecycle ticket 05: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's "Kiểm soát" rows (AL13, AL14, AL15, AL16, AL28, AL29) and per door
# that holds one, each naming the tests that call that door directly
# (failure-modes #5). Ten were run by hand while writing the tests (5/11/2026),
# each red: the run's own component in `reached_components`, the simulate
# exemption, the linked agent's component in the sub-agent stack, the hook
# loop, the lane's actor, `set_by` in the refusal, the lane's cancel, the
# kill-first order at admission, the kill key, and the simulate filter of the
# parked runs.
mutations:
  # ---- AL16, R8.1: who may kill and revive, at the component's workspace ------
  - name: AL16 R8.1 the kill asks the read key instead of studio.lifecycle.kill
    file: packages/python/dw_studio/src/dw_studio/lifecycle/application/kill.py
