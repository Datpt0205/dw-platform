# Mutation check of agent-lifecycle ticket 01: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control of the
# ticket's "Kiểm soát" rows (AL11, AL12, AL16, AL17, AL18) and per door that
# holds one, each test calling its door directly (failure-modes #5). Ten were
# run by hand while writing the tests (4/11/2026), each red: the tool step,
# the gateway door, the decide door, the resume hold, the principal and the
# company checks, the runner's halt mapping, the tool-errors re-raise, the
# sub-agent door and the 30 s grace. The migration's mutations apply in
# place, so their tests recreate the database from the mutated revision.
