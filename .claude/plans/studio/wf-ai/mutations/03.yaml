  - name: R6.5 a version whose content no longer hashes to its name is hosted
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/versions.py
    old: "        if found is None or workflow_sha256(found.content) != sha:"
    new: "        if found is None:"
    tests:
