  - name: R6.16 a new DW pins a tenant version
    file: packages/python/dw_platform/src/dw_platform/application/digital_workers.py
    old: "        if is_tenant_pin(configuration.workflow_version):"
    new: "        if False:"
    tests:
      - packages/python/dw_platform/tests/unit/test_digital_workers.py::test_a_new_dw_pins_a_packs_version_never_a_tenants
