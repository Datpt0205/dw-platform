# Mutation check of foundations-hardening ticket 09: scripts/mutate.py runs this file at the
# queue's close (.claude/rules/wave-close.md), not at the ticket.
# One mutation per guard of the Kiểm soát row the ticket implements (FH42). Each was broken
# by hand once at the ticket (ticket Comments); the tool's control run comes first at the close.
mutations:
  - name: FH42 a claim is not counted
    file: packages/python/dw_platform/src/dw_platform/adapters/persistence/offboarding.py
    old: |2
          "     claims = claims + 1,"
    new: |2
          "     claims = claims,"
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_a_request_that_dies_three_times_while_exporting_is_stopped_by_the_lane
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_another_company_is_claimed_in_the_tick_that_stops_one
  - name: FH42 the stop is audited as someone other than the lane
    file: packages/python/dw_platform/src/dw_platform/adapters/persistence/offboarding.py
    old: |2
                              lane=OFFBOARDING_LANE,
    new: |2
                              lane="offboarding_requester",
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_a_request_that_dies_three_times_while_exporting_is_stopped_by_the_lane
  - name: FH42 the stop record does not name the operator who asked
