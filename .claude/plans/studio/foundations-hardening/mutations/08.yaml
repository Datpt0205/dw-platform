# Mutation check of foundations-hardening ticket 08: scripts/mutate.py runs this file at the
# queue's close (.claude/rules/wave-close.md), not at the ticket.
# One mutation per Kiểm soát row the ticket implements (FH37, FH38, FH39, FH40, FH41, FH44),
# more where a row holds more than one guard. Each was broken by hand once at the ticket, a
# sample of them (ticket Comments); the tool's control run comes first at the close.
mutations:
  - name: FH37 the bundle writer holds every batch it wrote
    file: apps/worker/src/dw_worker/consumers/offboarding.py
    old: |
      def _write_rows(entry: IO[bytes], rows: list[dict[str, Any]], first: bool) -> None:
          text = "\n".join(json.dumps(row, default=_json_default, ensure_ascii=False) for row in rows)
    new: |
      def _write_rows(entry: IO[bytes], rows: list[dict[str, Any]], first: bool, _held: list[str] = []) -> None:  # noqa: B006
          text = "\n".join(json.dumps(row, default=_json_default, ensure_ascii=False) for row in rows)
          _held.append(text)
    tests:
      - apps/worker/tests/unit/test_offboarding_consumer.py::test_the_bundle_writer_holds_one_batch_not_the_table
  - name: FH37 a table arriving twice is written as a second entry
    file: apps/worker/src/dw_worker/consumers/offboarding.py
    old: |2
                          raise ValueError(f"{name} arrived in two runs of batches")
    new: |2
                          pass
    tests:
      - apps/worker/tests/unit/test_offboarding_consumer.py::test_a_table_arriving_in_two_runs_is_refused
