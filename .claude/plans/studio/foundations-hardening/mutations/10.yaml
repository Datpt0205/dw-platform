# Mutation check of foundations-hardening ticket 10: scripts/mutate.py runs this file at the
# queue's close (.claude/rules/wave-close.md), not at the ticket.
# One mutation per guard of the Kiểm soát row the ticket implements (FH43). The test database is
# rebuilt from the migrations at each session, so a mutated migration reaches it. Four were broken
# by hand once at the ticket (ticket Comments); the tool's control run comes first at the close.
mutations:
  - name: FH43 the waiver purge deletes for a tenant other than the transaction's
    file: db/migrations/versions/9cc87820a05f_offboarding_purges_sod_waivers.py
    old: "        IF p_tenant IS DISTINCT FROM NULLIF(current_setting('app.tenant_id', true), '')::uuid THEN"
    new: "        IF false THEN"
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_the_waiver_purge_refuses_any_tenant_but_its_own_offboarding_one
  - name: FH43 the waiver purge deletes for a live company
    file: db/migrations/versions/9cc87820a05f_offboarding_purges_sod_waivers.py
    old: "SELECT 1 FROM platform.tenants WHERE id = p_tenant AND status = 'offboarding'"
    new: "SELECT 1 FROM platform.tenants WHERE id = p_tenant"
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_the_waiver_purge_refuses_any_tenant_but_its_own_offboarding_one
  - name: FH43 every role may call the waiver purge
    file: db/migrations/versions/9cc87820a05f_offboarding_purges_sod_waivers.py
    old: '    op.execute(f"REVOKE ALL ON FUNCTION {_FUNCTION} FROM PUBLIC")'
    new: '    op.execute(f"GRANT EXECUTE ON FUNCTION {_FUNCTION} TO PUBLIC")'
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_the_read_only_agent_role_cannot_call_the_waiver_purge
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_only_dw_app_calls_the_waiver_purge_and_still_deletes_no_waiver
