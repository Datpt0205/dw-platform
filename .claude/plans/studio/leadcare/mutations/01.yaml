# Mutation check of leadcare ticket 01: scripts/mutate.py runs this file. One
# mutation per Kiểm soát row the ticket implements (LCP1-LCP11, LCP13-LCP15,
# LCP17, LCP18) and per guard it adds (the parameter bounds, the intake lane's
# consent record in the item's transaction).
mutations:
  - name: LCP1 a send outside an approved lane loads
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/validate.py
    old: '            self._add(path, "wf.hitl_gate_missing", step.id)'
    new: "            pass"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_leadcare_pack.py::test_a_copy_that_sends_outside_an_approved_lane_is_refused
  - name: LCP3 a wrong signature is trusted
    file: packages/python/dw_platform/src/dw_platform/application/intake.py
    old: "            not matches"
    new: "            False"
    tests:
      - packages/python/dw_platform/tests/integration/test_intake_db.py::test_every_untrusted_call_is_the_same_refusal_and_writes_nothing
  - name: LCP3 a stale timestamp is on time
    file: packages/python/dw_platform/src/dw_platform/application/intake.py
    old: "            or skew > MAX_SKEW_SECONDS"
    new: "            or False"
    tests:
      - packages/python/dw_platform/tests/integration/test_intake_db.py::test_every_untrusted_call_is_the_same_refusal_and_writes_nothing
  - name: LCP3 a retired or draft DW takes leads
    file: packages/python/dw_platform/src/dw_platform/application/intake.py
    old: '            or scope.state not in ("operating", "paused")'
    new: "            or False"
    tests:
      - packages/python/dw_platform/tests/integration/test_intake_db.py::test_every_untrusted_call_is_the_same_refusal_and_writes_nothing
  - name: LCP5 a lead without consent is taken
    file: packages/python/dw_platform/src/dw_platform/application/intake.py
    old: '        if not (isinstance(consent, Mapping) and consent.get("granted") is True):'
    new: "        if False:"
    tests:
      - packages/python/dw_platform/tests/integration/test_intake_db.py::test_a_lead_without_consent_is_refused_before_its_schema
  - name: LCP9 the mail goes to whoever the input names
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/pack_tools.py
    old: '        if normalize_address("email", payload.to) != normalize_address('
    new: '        if False and normalize_address("email", payload.to) != normalize_address('
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_pack_tools.py::test_a_recipient_other_than_the_lead_is_refused
  - name: LCP10 the tool sends to a lead without consent
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/pack_tools.py
    old: '        if not (isinstance(consent, Mapping) and consent.get("granted") is True):'
    new: "        if False:"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_pack_tools.py::test_a_lead_without_consent_is_refused
  - name: LCP13 the mail reaches a host outside the dev mailbox
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/pack_tools.py
    old: "        if self.is_deployed or self.smtp_host not in SINK_HOSTS or self.sender is None:"
    new: "        if self.sender is None:"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_pack_tools.py::test_nothing_but_the_dev_mailbox_is_reached
  - name: LCP15 a mail that may have left is called not sent
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/pack_tools.py
    old: |2-
                  raise OutcomeUnknownError(
                      "the mail may have left", details={"reason_code": "send_outcome_unknown"}
    new: |2-
                  raise NotDispatchedError(
                      "the mail may have left", details={"reason_code": "send_outcome_unknown"}
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_pack_tools.py::test_a_mail_that_may_have_left_is_outcome_unknown
  - name: LCP17 a deployed profile opens the door
    file: apps/api/src/dw_api/routes/v1/intake.py
    old: "    if container.settings.is_deployed:"
    new: "    if False:"
    tests:
      - apps/api/tests/unit/test_intake_endpoint.py::test_a_deployed_profile_keeps_the_door_closed
  - name: LCP7 a short intake secret starts a deployed API
    file: apps/api/src/dw_api/settings.py
    old: "            if len(self.intake_signing_secret.get_secret_value().encode()) < 32:"
    new: "            if False:"
    tests:
      - apps/api/tests/unit/test_intake_endpoint.py::test_a_deployed_api_needs_32_bytes_of_intake_secret
  - name: LCP18 the intake writes no consent record
    file: packages/python/dw_platform/src/dw_platform/adapters/persistence/work_queue_repo.py
    old: "                    await session.execute(INSERT_CONSENT, dict(also))"
    new: "                    pass"
    tests:
      - packages/python/dw_platform/tests/integration/test_intake_db.py::test_a_signed_lead_is_one_item_with_its_audit_and_consent_record
  - name: R3.8 a reply wait under its minimum starts
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/wflite/starter.py
    old: "            (variable.minimum is not None and value < variable.minimum)"
    new: "            False"
    tests:
      - apps/worker/tests/integration/test_leadcare_db.py::test_a_reply_wait_under_30_seconds_does_not_start
