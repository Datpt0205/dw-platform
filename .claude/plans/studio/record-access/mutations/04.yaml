      - packages/python/dw_studio/tests/integration/test_actor_boundaries.py::test_r6_3_a_context_naming_another_principal_or_run_binds_nothing
      - packages/python/dw_studio/tests/integration/test_actor_boundaries.py::test_r6_9_an_unattended_workflow_reads_with_its_service_account
  - name: RA18 R6.3 (e) the mode comes from RunContext, not the run row
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/record_session.py
    old: "        (await session.execute(_REACH_DOOR)).first()\n"
    new:
      "        (await session.execute(_REACH_DOOR)).first()\n        await session.execute(text(\"SELECT\
