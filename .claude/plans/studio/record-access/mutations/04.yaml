# Mutation check of record-access ticket 04: scripts/mutate.py runs this file at
# the queue's close (wave-close.md). One mutation per control (RA18-RA21, RA27 and
# the gate's (b), (d), (e), (f), (g), (h), (i), (m), (o)) and per layer that holds
# one (failure-modes #3, #5): the database's in the migration, taking effect when
# the suite's session fixture recreates the database; the application's in the
# module that holds it. The scan mutations edit the file a source scan reads, in
# place (`mutate-in-place`).
mutations:
  - name: RA18 R6.3 a module outside the list binds agent
    file: packages/python/dw_platform/tests/unit/test_session_setting_scan.py
    old: |2-
          "packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/record_session.py": (
              frozenset({"agent"}),
    new: |2-
          "packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/record_session.py": (
              frozenset({"agent", "workflow"}),
    tests:
      - packages/python/dw_platform/tests/unit/test_session_setting_scan.py::test_a_binder_or_a_builder_outside_its_list_is_named
  - name: RA18 R6.3 (g) app.boundary_id leaves the scanned settings
    file: packages/python/dw_platform/tests/unit/test_session_setting_scan.py
    old: 'SETTINGS = ("app.workspace_scope", "app.actor_kind", "app.boundary_id", "app.run_mode")'
    new: 'SETTINGS = ("app.workspace_scope", "app.actor_kind", "app.run_mode")'
    tests:
      - packages/python/dw_platform/tests/unit/test_session_setting_scan.py::test_each_form_of_a_setter_is_named
