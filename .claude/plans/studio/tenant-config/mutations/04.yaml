    old: "        await load_as(app_sessions, outsider.tenant_id, mine)"
    new: "        await load_as(async_sessionmaker(migrator, class_=AsyncSession), outsider.tenant_id, mine)"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_another_tenant_neither_builds_on_nor_loads_this_tenants_rows
  - name: TC15 R6.4 the store reads each target's current live version
    file: packages/python/dw_studio/src/dw_studio/core/adapters/run_manifest_store.py
    old: "    artifact_versions.c.id == run_manifest_keys.c.artifact_version_id,\n"
    new: "    artifact_versions.c.stage == \"live\",\n    artifact_versions.c.artifact_id\n    == (lambda p: sa.select(p.c.artifact_id).where(p.c.id == run_manifest_keys.c.artifact_version_id).scalar_subquery())(artifact_versions.alias(\"p\")),\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_resume_elsewhere_resolves_the_version_it_pinned
  - name: TC15 R6.4 the pinned hash is not compared
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/pinned.py
    old: "    if row is not None and row.current_hash is not None and row.current_hash != entry.content_hash:"
    new: "    if False:"
    tests:
