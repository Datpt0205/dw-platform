    old: "    if row.stage != Stage.DRAFT.value:"
    new: "    if root.get(\"stage\") != Stage.DRAFT.value:"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_candidate_sent_back_and_edited_refuses_its_test_run

  # ---- R6.7, R6.9 (TC28): only simulate runs a draft --------------------------
