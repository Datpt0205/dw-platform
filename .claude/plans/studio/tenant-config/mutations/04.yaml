# Mutation check of tenant-config ticket 04: scripts/mutate.py runs this file at
# the queue's close (wave-close.md). One mutation per control of the ticket's
# "Kiểm soát" rows (TC15, TC21, TC28, TC29, TC31, TC32) and per layer that
# holds one. Run by hand while writing the tests (4/11/2026), each red in its
# named case: the resolver's key check, the hash comparison, the draft-mode
# check, the trigger's mode check, the keys' ON CONFLICT and the receipt's FOR
# SHARE. The migration's and the tests' own mutations apply in place, so their
# tests recreate the database from the mutated revision.
mutations:
  # ---- R6.1: what is pinned ---------------------------------------------
  - name: R6.1 a sealed root's closure is not its definition manifest's
    file: packages/python/dw_studio/src/dw_studio/core/application/run_manifests.py
    old: '                "closure": definition["closure"],'
    new: '                "closure": [],'
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_sealed_root_pins_its_definition_closure_and_three_keys
  - name: R6.1 a sealed root's keys skip its where-used versions
    file: packages/python/dw_studio/src/dw_studio/core/application/run_manifests.py
    old: "            pinned = await uow.pinned_versions(version.id)"
    new: "            pinned = []"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_sealed_root_pins_its_definition_closure_and_three_keys
  - name: TC28 R6.1 a draft is hashed apart from the seal's step
    file: packages/python/dw_studio/src/dw_studio/core/application/run_manifests.py
    old: "            definition = definition_body(found.kind, version.artifact_id, root_hash, closure)"
    new: "            definition = definition_body(found.kind, version.id, root_hash, closure)"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_simulated_draft_pins_the_hash_its_seal_gives_and_writes_nothing_else
  - name: TC28 R6.1 a draft's receipt writes its definition manifest
    file: packages/python/dw_studio/src/dw_studio/core/application/run_manifests.py
    old: "            pinned_hash = definition_hash(definition)\n"
    new: "            pinned_hash = definition_hash(definition)\n            await uow.put_manifest(pinned_hash, definition)\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_simulated_draft_pins_the_hash_its_seal_gives_and_writes_nothing_else
  - name: R6.1 the receipt reads the draft without FOR SHARE on its artifact
    file: packages/python/dw_studio/src/dw_studio/core/adapters/artifact_store.py
    old: "        # a `save_draft` it waited for had committed.\n        kind = await self.session.scalar(\n            sa.select(artifacts.c.kind)\n            .where(artifacts.c.id == artifact_id, artifacts.c.deleted_at.is_(None))\n            .with_for_update(read=True)\n"
    new: "        # a `save_draft` it waited for had committed.\n        kind = await self.session.scalar(\n            sa.select(artifacts.c.kind)\n            .where(artifacts.c.id == artifact_id, artifacts.c.deleted_at.is_(None))\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_the_receipt_holds_off_a_save_of_the_draft_it_hashes
  - name: R6.1 a body past 1 MiB is not read back by its constraint
    file: packages/python/dw_studio/src/dw_studio/core/adapters/artifact_store.py
    old: "            if _refused(exc) == _RUN_MANIFEST_SIZE:"
    new: "            if False:"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_a_body_past_one_mebibyte_is_too_large_and_written_nowhere

  # ---- R6.2: one row per content ------------------------------------------
  - name: R6.2 the manifest row is written without ON CONFLICT
    file: packages/python/dw_studio/src/dw_studio/core/adapters/artifact_store.py
    old: "                .values(tenant_id=self.context.tenant_id, hash=manifest_hash, body=body)\n                .on_conflict_do_nothing(index_elements=[\"tenant_id\", \"hash\"])\n"
    new: "                .values(tenant_id=self.context.tenant_id, hash=manifest_hash, body=body)\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_the_same_content_is_one_manifest_and_another_mode_another
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_two_concurrent_builds_of_one_content_both_commit
  - name: R6.2 the key rows are written without ON CONFLICT
    file: packages/python/dw_studio/src/dw_studio/core/adapters/artifact_store.py
    old: "            .on_conflict_do_nothing()\n"
    new: ""
    tests:
      - packages/python/dw_studio/tests/integration/test_run_manifest.py::test_two_concurrent_builds_of_one_content_both_commit
  - name: R6.2 the run mode is not in the body
    file: packages/python/dw_studio/src/dw_studio/core/application/run_manifests.py
    old: '                "run_mode": run_mode,'
    new: '                "run_mode": "live",'
    tests:
