    new: "            definition_hash=manifest_hash,\n"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_two_seals_of_one_draft_give_one_number
  - name: TC2 R2.7 seal reads before the artifact lock
