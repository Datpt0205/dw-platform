# Mutation check of tenant-config ticket 02: scripts/mutate.py runs this file at
# the queue's close (wave-close.md). One mutation per control of the ticket's
# "Kiểm soát" rows (TC1-TC7, TC21, TC24, TC27, TC29-TC31) and per layer that
# holds one. Five were run by hand while writing the tests (3/11/2026): the
# FOR SHARE read and the artifact lock of each of save_draft, create_draft and
# seal, each red in its own named case. The migration's mutations apply in
# place, so their tests recreate the database from the mutated revision.
mutations:
  - name: TC1 a sealed version's content changes
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "        IF OLD.stage <> 'draft' AND ("
    new: "        IF false AND ("
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_a_sealed_versions_content_is_fixed
  - name: TC4 the database lets the API name change after live
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "        IF NEW.api_name IS DISTINCT FROM OLD.api_name AND EXISTS ("
    new: "        IF false AND EXISTS ("
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_the_api_name_is_fixed_by_the_database_once_live
  - name: TC27 R2.14 the gate flag gets a default
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "        has_quality_gate boolean NOT NULL,"
    new: "        has_quality_gate boolean NOT NULL DEFAULT true,"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_a_kind_registered_without_its_gate_flag_is_refused
  - name: TC29 to_version_id is a one-column key
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "            FOREIGN KEY (to_version_id, tenant_id)\n            REFERENCES studio.artifact_versions (id, tenant_id) ON DELETE RESTRICT,"
    new: "            FOREIGN KEY (to_version_id)\n            REFERENCES studio.artifact_versions (id) ON DELETE RESTRICT,"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_a_dependency_never_points_into_another_tenant
  - name: TC29 the owning workspace is a one-column key
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "            FOREIGN KEY (owning_workspace_id, tenant_id)\n            REFERENCES platform.workspaces (id, tenant_id) ON DELETE RESTRICT,"
    new: "            FOREIGN KEY (owning_workspace_id)\n            REFERENCES platform.workspaces (id) ON DELETE RESTRICT,"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_an_artifact_is_never_owned_by_another_tenants_workspace
  - name: TC30 the owning workspace may change
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "        IF NEW.owning_workspace_id IS DISTINCT FROM OLD.owning_workspace_id THEN"
    new: "        IF false THEN"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_the_owning_workspace_never_changes
  - name: TC30 studio-skeleton R2.7 dw_app gets UPDATE of the whole table
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "    \"GRANT UPDATE (api_name, labels, last_version_no, row_version, deleted_at, updated_at)\"\n    \" ON studio.artifacts TO dw_app;\","
    new: "    \"GRANT UPDATE ON studio.artifacts TO dw_app;\","
    tests:
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_the_artifact_envelope_grants_dw_app_its_writes_and_no_more
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_the_studio_schema_holds_nothing_it_should_not
  - name: TC27 R2.20 the one-unreleased index narrowed to drafts
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "    \" (artifact_id) WHERE stage IN ('draft', 'evaluating', 'awaiting_approval')\","
    new: "    \" (artifact_id) WHERE stage = 'draft'\","
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_one_unreleased_version_per_artifact
  - name: TC31 R3.8 the delete trigger reads no status
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "           IS DISTINCT FROM 'offboarding' THEN"
    new: "           IS NULL THEN"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_only_an_offboarding_company_loses_these_rows
  - name: TC5 R3.3 an artifact target need not name its id
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: "                AND to_key = to_artifact_id::text)"
    new: ")"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_an_artifact_dependency_names_its_target_by_id
  - name: TC5 the soft delete ignores dependents
