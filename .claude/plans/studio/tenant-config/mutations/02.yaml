      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_a_seal_in_flight_holds_off_the_soft_delete_of_its_target
  - name: TC21 dw_app loses DELETE on dependencies
    file: db/migrations/versions/67071483caa6_studio_artifact_envelope.py
    old: '    "GRANT INSERT, DELETE ON studio.dependencies TO dw_app;",'
    new: '    "GRANT INSERT ON studio.dependencies TO dw_app;",'
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding_coverage.py
      - packages/python/dw_platform/tests/integration/test_privileges.py::test_the_artifact_envelope_grants_dw_app_its_writes_and_no_more
  - name: TC21 R3.6 the purge order loses the to_version_id edge
    file: packages/python/dw_platform/src/dw_platform/adapters/persistence/offboarding.py
    old: "    \"   AND NOT (k.confdeltype = 'a' AND k.condeferrable AND k.condeferred)\""
    new: "    \"   AND NOT (k.confdeltype = 'a' AND k.condeferrable AND k.condeferred)\"\n    \"   AND k.conname <> 'fk_dependencies_to_version_id_artifact_versions'\""
    tests:
      - packages/python/dw_platform/tests/integration/test_offboarding.py::test_offboarding_purges_studio_artifacts_that_use_each_other
      - packages/python/dw_platform/tests/integration/test_offboarding_coverage.py
  - name: TC3 R2.5 save_draft compares no version
    file: packages/python/dw_studio/src/dw_studio/core/application/service.py
    old: "            if not expected.matches(unreleased.row_version):"
    new: "            if False:"
