    old: "        row = await self._load(tx, artifact_id, lock=True)\n        entry = self.registry.get(row.kind)"
    new: "        row = await self._load(tx, artifact_id, lock=False)\n        entry = self.registry.get(row.kind)"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_each_version_write_reads_only_after_the_artifact_lock
  - name: R2.7 save_draft reads before the artifact lock
    file: packages/python/dw_studio/src/dw_studio/core/application/service.py
    old: "            row = await self._load(tx, artifact_id, lock=True)\n            await self._writable(tx, row, await self._readable(tx, row))\n            unreleased = _unreleased(await tx.versions(artifact_id))"
    new: "            row = await self._load(tx, artifact_id, lock=False)\n            await self._writable(tx, row, await self._readable(tx, row))\n            unreleased = _unreleased(await tx.versions(artifact_id))"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_each_version_write_reads_only_after_the_artifact_lock
  - name: R2.7 R2.23 create_draft reads before the artifact lock
    file: packages/python/dw_studio/src/dw_studio/core/application/service.py
    old: "            row = await self._load(tx, artifact_id, lock=True)\n            await self._writable(tx, row, await self._readable(tx, row))\n            if not expected.matches(row.row_version):\n                raise _stale()\n            versions = await tx.versions(artifact_id)"
    new: "            row = await self._load(tx, artifact_id, lock=False)\n            await self._writable(tx, row, await self._readable(tx, row))\n            if not expected.matches(row.row_version):\n                raise _stale()\n            versions = await tx.versions(artifact_id)"
    tests:
      - packages/python/dw_studio/tests/integration/test_artifact_envelope.py::test_each_version_write_reads_only_after_the_artifact_lock
  - name: TC27 R2.13 seal moves the stage
