# Mutation check of tenant-config ticket 03: scripts/mutate.py runs this file.
# One mutation per control (R4.1-R4.5, R5.1-R5.6) and per layer that holds one
# (the executor and the agent wrapper hold R5.6 both; failure-modes #3, #5).
mutations:
  - name: R4.2 a context that names no mode is live
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/contracts.py
    old: '    run_mode: RunMode = "simulate"'
    new: '    run_mode: RunMode = "live"'
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_mode.py::test_a_context_that_names_no_mode_is_simulate
  - name: R4.4 a child runs looser than its parent
    file: packages/python/dw_kernel/src/dw_kernel/run_mode.py
    old: "    return parent if _ORDER.index(parent) <= _ORDER.index(requested) else requested"
    new: "    return requested"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_mode.py::test_a_child_runs_no_looser_than_its_parent
  - name: R5.1 no mode step at the executor
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/executor.py
    old: "        if not call.definition.intercepted_in(call.run_context.run_mode):"
    new: "        if True:"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_mode.py::test_outside_live_an_external_call_is_answered_by_a_sample
      - packages/python/dw_agent_runtime/tests/unit/test_run_mode.py::test_a_critical_tool_opens_no_approval_outside_live
  - name: R5.6 the agent wrapper asks a person for an intercepted call
    # Since tools-and-skills/01 the wrapper asks `ToolExecutor.approval_required`.
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/executor.py
    old: "        ) and not definition.intercepted_in(run_context.run_mode)"
    new: "        )"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_agent_factory.py::test_a_gated_tool_asks_nobody_in_a_simulated_run
  - name: R5.3 the sample is not checked by the output model
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/executor.py
    old: "            validated = tool.behaviour.validate_output(sample_of(tool.behaviour.output_schema()))"
    new: "            validated = SampleOutput.model_validate(sample_of(tool.behaviour.output_schema()))"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_run_mode.py::test_a_sample_that_fails_the_output_model_is_a_validation_failure
  - name: R5.2 the simulated call's audit is written apart from its row
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/tool_execution_store.py
    old: "                await SqlAuditRepository(session).append(audit)"
    new: "                pass"
    tests:
      - packages/python/dw_agent_runtime/tests/integration/test_run_mode_db.py::test_a_simulated_row_is_written_with_its_audit_or_not_at_all
  - name: R4.3 the run row records a constant mode
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/run_store.py
    old: "                run_mode=run_context.run_mode,"
    new: '                run_mode="live",'
    tests:
      - packages/python/dw_agent_runtime/tests/integration/test_run_mode_db.py::test_the_runner_records_the_contexts_own_mode
  - name: R4.5 a resume does not read the mode from the row
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/adapters/run_store.py
    old: "        run_mode=record.run_mode,"
    new: '        run_mode="live",'
    tests:
      - packages/python/dw_agent_runtime/tests/integration/test_run_mode_db.py::test_a_simulated_run_resumes_simulated_in_another_runner
  - name: R4.3 a DW's run is not live
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/digital_worker_context.py
    old: '        run_mode="live",'
    new: ""
    tests:
      - apps/worker/tests/integration/test_wflite_runs_db.py::test_a_run_waits_for_approval_sends_once_waits_and_finishes
  - name: R5.4 a tool with no effect is intercepted too
    file: packages/python/dw_agent_runtime/src/dw_agent_runtime/tool_specs.py
    old: '            simulate_safe=self.side_effect_level == "none",'
    new: "            simulate_safe=False,"
    tests:
      - packages/python/dw_agent_runtime/tests/unit/test_tool_specs.py::test_only_a_spec_with_no_effect_runs_for_real_outside_live
