# Mutation check of studio-skeleton ticket 04: scripts/mutate.py runs this file
# at the queue's close (wave-close.md). One mutation per control the ticket adds,
# each guarded by a pytest case of apps/api/tests/unit/test_compose_policy.py,
# which runs the rules on hand-built rendered models without Docker. The same
# controls are planted in real compose files by scripts/test_compose_policy.sh
# (bash, so not run by mutate.py); each rule switched off was also seen to turn
# that suite red by hand on 5/11/2026 (ticket Comments). The script is not under
# src/, so mutate.py mutates it in place, one at a time.
mutations:
  - name: R8.1 dw-internal rule off
    file: scripts/verify_compose_policy.py
    old: '    "dw-internal": _each(_on_dw_internal),'
    new: '    "dw-internal": lambda _r, _s: False,'
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_each_defect_breaks_its_own_rule
  - name: R8.1 an alias of dw-internal is not dw-internal
    file: scripts/verify_compose_policy.py
    old: "    return any(_network_name(model, key) == target for key in _networks(spec))"
    new: '    return "dw-internal" in _networks(spec)'
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_an_alias_of_dw_internal_is_dw_internal
  - name: R8.2 a network that is not internal passes
    file: scripts/verify_compose_policy.py
    old: '        if (model.get("networks", {}).get(key) or {}).get("internal") is not True:'
    new: "        if False:"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_each_defect_breaks_its_own_rule
  - name: R8.2 a service with no network passes
    file: scripts/verify_compose_policy.py
    old: '    if not _networks(spec) and not spec.get("network_mode"):'
    new: "    if False:"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_each_defect_breaks_its_own_rule
  - name: R8.2 an undeclared caller on the network passes
    file: scripts/verify_compose_policy.py
    old: "        if members - allowed:"
    new: "        if False:"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_sharing_a_network_with_an_undeclared_caller_is_red
  - name: R8.3 a pulled image without a digest passes
    file: scripts/verify_compose_policy.py
    old: '        return not _PULLED_PINNED.match(str(spec.get("image") or ""))'
    new: "        return False"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_each_defect_breaks_its_own_rule
  - name: R8.3 an unpinned FROM passes
    file: scripts/verify_compose_policy.py
    old: "    return not images or not all(_PIN_DIGEST.search(image) for image in images)"
    new: "    return False"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_a_built_image_needs_every_from_pinned
      - apps/api/tests/unit/test_compose_policy.py::test_from_an_arg_reads_its_default
  - name: R8.3 an unreadable Dockerfile passes
    file: scripts/verify_compose_policy.py
    old: "    if text is None:\n        return True\n"
    new: "    if text is None:\n        return False\n"
    tests:
      - apps/api/tests/unit/test_compose_policy.py::test_a_missing_dockerfile_is_unpinned
  - name: R8.4 ports rule off
    file: scripts/verify_compose_policy.py
    old: '    "ports": _each(_publishes_ports, tuple(c for c in COMBINATIONS if c != PORTS_ALLOWED_IN)),'
    new: '    "ports": lambda _r, _s: False,'
